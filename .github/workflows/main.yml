name: Build FBrowserbig

on:
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 缓存 Gradle 及依赖库（附加包），大幅提升二次构建速度
      - name: Setup Gradle & Cache Dependencies
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      # 1. 构建常规 APK（用于直接安装测试）
      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # 2. 构建 AAB（Android App Bundle，用于上传 Google Play）
      - name: Build Release AAB
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Show Build Outputs & Sizes
        run: |
          echo "=== APK Files ==="
          ls -lh app/build/outputs/apk/release/ || true
          echo "=== AAB Files ==="
          ls -lh app/build/outputs/bundle/release/ || true

      # 上传所有产物
      - name: Upload Artifacts (APK & AAB)
        uses: actions/upload-artifact@v4
        with:
          name: FBrowserbig-Builds
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7

      # 打 Tag 时自动发布 Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
