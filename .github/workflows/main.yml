name: Build FBrowserbig

on:
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle & Cache Dependencies
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Install Build-Tools & Platform
        run: |
          SDKMANAGER=$(find $ANDROID_HOME/cmdline-tools -name sdkmanager | head -n 1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | $SDKMANAGER --licenses > /dev/null 2>&1 || true
          yes | $SDKMANAGER "build-tools;36.0.0" "platforms;android-36"

      - name: Verify Build-Tools
        run: |
          ls -lh $ANDROID_HOME/build-tools/36.0.0/aapt2 || echo "aapt2 not found!"

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build Release AAB
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Show Build Outputs & Sizes
        run: |
          echo "=== APK Files ==="
          ls -lh app/build/outputs/apk/release/ || true
          echo "=== AAB Files ==="
          ls -lh app/build/outputs/bundle/release/ || true

      - name: Upload Artifacts (APK & AAB)
        uses: actions/upload-artifact@v4
        with:
          name: FBrowserbig-Builds
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true